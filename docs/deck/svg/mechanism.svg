<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b766c"/>
    </marker>
    <marker id="a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff3527"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- the claim, centre -->
  <rect x="400" y="24" width="320" height="86" fill="#121214" stroke="#ff3527"/>
  <text x="560" y="52" fill="#eae6de" font-size="14" text-anchor="middle">COVERAGE POSITION</text>
  <text x="560" y="76" fill="#7b766c" font-size="12.2" text-anchor="middle">a range of source blocks</text>
  <text x="560" y="95" fill="#7b766c" font-size="12.2" text-anchor="middle">+ a predicate + a depth</text>

  <!-- underwriter, left -->
  <rect x="20" y="150" width="290" height="96" fill="#121214" stroke="#26262a"/>
  <text x="40" y="178" fill="#eae6de" font-size="13">UNDERWRITER</text>
  <text x="40" y="200" fill="#7b766c" font-size="12.2">locks a bond behind the claim</text>
  <text x="40" y="224" fill="#eae6de" font-size="12">bond &gt;= exposure</text>
  <line x1="310" y1="176" x2="400" y2="86" stroke="#7b766c" marker-end="url(#a2)"/>

  <!-- borrower, right -->
  <rect x="810" y="150" width="290" height="96" fill="#121214" stroke="#26262a"/>
  <text x="830" y="178" fill="#eae6de" font-size="13">BORROWER</text>
  <text x="830" y="200" fill="#7b766c" font-size="12.2">releases credit against it</text>
  <text x="830" y="224" fill="#eae6de" font-size="12">only while it holds</text>
  <line x1="810" y1="176" x2="720" y2="86" stroke="#7b766c" marker-end="url(#a2)"/>

  <!-- attestcoin, centre bottom -->
  <rect x="400" y="266" width="320" height="76" fill="#0a0a0b" stroke="#26262a" stroke-dasharray="4 4"/>
  <text x="560" y="292" fill="#eae6de" font-size="12.5" text-anchor="middle">ATTESTCOIN PRECOMPILES</text>
  <text x="560" y="312" fill="#7b766c" font-size="11.8" text-anchor="middle">0x0FD2 block prover   0x0FD3 chain info</text>
  <text x="560" y="331" fill="#7b766c" font-size="11.8" text-anchor="middle">verifies a source receipt, emits nothing on failure</text>
  <line x1="560" y1="266" x2="560" y2="118" stroke="#7b766c" marker-end="url(#a2)"/>

  <!-- challenger, bottom left -->
  <rect x="20" y="266" width="290" height="76" fill="#121214" stroke="#ff3527"/>
  <text x="40" y="292" fill="#ff3527" font-size="13">CHALLENGER</text>
  <text x="40" y="313" fill="#7b766c" font-size="12.2">no stake, no allowlist,</text>
  <text x="40" y="331" fill="#7b766c" font-size="12.2">no permission needed</text>
  <line x1="310" y1="304" x2="400" y2="304" stroke="#ff3527" marker-end="url(#a2b)"/>

  <!-- outcome, bottom right -->
  <rect x="810" y="266" width="290" height="76" fill="#121214" stroke="#4ade80"/>
  <text x="830" y="292" fill="#4ade80" font-size="13">ONE CONTRADICTING TX</text>
  <text x="830" y="313" fill="#7b766c" font-size="12.2">proven inside the range</text>
  <text x="830" y="331" fill="#eae6de" font-size="12.2">takes the whole bond, atomically</text>
  <line x1="720" y1="304" x2="810" y2="304" stroke="#4ade80" marker-end="url(#a2g)"/>

  <!-- the failure mode -->
  <text x="560" y="388" fill="#7b766c" font-size="12.2" text-anchor="middle">
    if nobody finds one, the bond returns to the underwriter. the same code path decides both.
  </text>
</svg>
