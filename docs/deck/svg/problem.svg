<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b766c"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff3527"/>
    </marker>
  </defs>

  <!-- left chain -->
  <rect x="20" y="70" width="250" height="160" fill="#121214" stroke="#26262a"/>
  <text x="40" y="100" fill="#eae6de" font-size="15">ETHEREUM</text>
  <text x="40" y="122" fill="#7b766c" font-size="12">source chain</text>
  <line x1="40" y1="138" x2="250" y2="138" stroke="#26262a"/>
  <text x="40" y="166" fill="#7b766c" font-size="12">collateral lives here</text>
  <text x="40" y="188" fill="#7b766c" font-size="12">and so does borrower</text>
  <text x="40" y="210" fill="#7b766c" font-size="12">behaviour</text>

  <!-- right chain -->
  <rect x="730" y="70" width="250" height="160" fill="#121214" stroke="#26262a"/>
  <text x="750" y="100" fill="#eae6de" font-size="15">CREDITCOIN</text>
  <text x="750" y="122" fill="#7b766c" font-size="12">lending chain</text>
  <line x1="750" y1="138" x2="960" y2="138" stroke="#26262a"/>
  <text x="750" y="166" fill="#7b766c" font-size="12">the lender extends</text>
  <text x="750" y="188" fill="#7b766c" font-size="12">credit here</text>
  <text x="750" y="210" fill="#7b766c" font-size="12">in real time</text>

  <!-- the blind spot -->
  <line x1="270" y1="150" x2="730" y2="150" stroke="#7b766c" stroke-width="1.5"
        stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="500" y="136" fill="#7b766c" font-size="12" text-anchor="middle">cannot read it</text>

  <!-- the trusted report -->
  <line x1="270" y1="215" x2="730" y2="215" stroke="#ff3527" stroke-width="1.5"
        marker-end="url(#arb)"/>
  <text x="500" y="205" fill="#ff3527" font-size="12" text-anchor="middle">a report, on trust</text>
  <text x="500" y="244" fill="#ff3527" font-size="12" text-anchor="middle">costs the reporter nothing when wrong</text>

  <!-- the result -->
  <text x="500" y="305" fill="#7b766c" font-size="13" text-anchor="middle">
    so the lender either believes the report, or lends so little it does not matter
  </text>
</svg>
